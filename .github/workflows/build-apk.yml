name: Build Ameline Restaurant APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract game project
        run: |
          mkdir source
          unzip -q AmelineRestaurantAndroid_Telephone.zip -d source

      - name: Build APK
        run: |
          cd source/AmelineRestaurantAndroid
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Ameline-Restaurant-APK
          path: source/AmelineRestaurantAndroid/app/build/outputs/apk/debug/app-debug.apk
